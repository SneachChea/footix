[project]
name = "pyfootix"
version = "0.3.1"
description = "Footix is a Python package for sports betting analysis and modeling, with a focus on football (soccer)."
authors = [{ name = "sneachchea" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10, <3.15"
dependencies = [
    "numpy>=2.0.0,<3",
    "scipy>=1.10.1,<2",
    "scikit-learn>=1.2.2,<2",
    "tqdm>=4.65.0,<5",
    "pymc>=5.3.1,<6",
    "pytensor>=2.11.2,<3",
    "torch>=2.6.0,<3",
    "requests>=2.32.3,<3",
    "networkx>=3.4.2,<4",
    "lxml>=5.4.0,<6",
    "cssselect>=1.3.0,<2",
    "rapidfuzz>=3.0,<4",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.10.0,<4",
    "nutpie>=0.15",
]

[project.urls]
repository = "https://github.com/SneachChea/footix"

[tool.hatch.build.targets.wheel]
packages = ["footix"]

[dependency-groups]
dev = [
    "pytest>=7.3.1,<8",
    "pre-commit>=3.5.0,<4",
    "ruff>=0.7.2,<0.8",
    "mypy>=1.3.0,<2",
    "sphinx>=8.1.3,<9",
    "sphinx-autodoc-typehints>=3.0.0,<4",
    "sphinx-rtd-theme>=3.0.2,<4",
    "types-requests>=2.32.0.20241016",
    "types-PyYAML>=6.0.12.20241230",
    "pytest-cov>=7.0.0,<8",
    "pydocstyle>=6.3.0,<7",
    "roman-numerals>=4.1.0,<5",
    "pygments>=2.19.2,<3",
    "ipywidgets>=8.1.8,<9",
    "jupyter>=1.1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 99
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.mypy]
ignore_missing_imports = true
exclude = "^docs/"
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
show_error_codes = true
disable_error_code = ["no-any-return", "var-annotated", "operator", "attr-defined", "arg-type"]
